name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: "Dockerfile 路径"
        required: false
        default: "Docker/Dockerfile"
      context:
        description: "构建上下文目录"
        required: false
        default: "Docker"
      platforms:
        description: "构建平台（多架构用逗号分隔）"
        required: false
        default: "linux/amd64"
      push_image:
        description: "是否推送到 GHCR"
        required: false
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: forget-dust/grocery

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build inputs
        id: cfg
        run: |
          echo "dockerfile=${{ inputs.dockerfile || 'Docker/Dockerfile' }}"  >> "$GITHUB_OUTPUT"
          echo "context=${{ inputs.context || 'Docker' }}"                    >> "$GITHUB_OUTPUT"
          echo "platforms=${{ inputs.platforms || 'linux/amd64' }}"           >> "$GITHUB_OUTPUT"
          echo "push=${{ github.event_name == 'push' || inputs.push_image }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.cfg.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.cfg.outputs.context }}
          file: ${{ steps.cfg.outputs.dockerfile }}
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            echo "### 构建结果"
            echo "- Dockerfile: \`${{ steps.cfg.outputs.dockerfile }}\`"
            echo "- Context: \`${{ steps.cfg.outputs.context }}\`"
            echo "- Platforms: \`${{ steps.cfg.outputs.platforms }}\`"
            echo "- Push: \`${{ steps.cfg.outputs.push }}\`"
            echo ""
            echo "镜像: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "包页面: https://github.com/users/${{ github.repository_owner }}/packages/container/package/grocery"
          } >> "$GITHUB_STEP_SUMMARY"
