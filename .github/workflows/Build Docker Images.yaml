name: Build Docker Images

on:
  workflow_dispatch:
    inputs:
      dockerfile:
        description: "Dockerfile 路径"
        default: "Docker/Dockerfile"
      context:
        description: "构建上下文目录"
        default: "Docker"
      platforms:
        description: "构建平台（多架构用逗号分隔）"
        default: "linux/amd64"
      tag:
        description: "自定义镜像 tag（留空则用 commit sha）"
        default: ""
      push_image:
        description: "是否推送到 GHCR"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: forget-dust/grocery

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 优先用仓库 Secret CR_PAT；没配则退回内置 GITHUB_TOKEN
      - name: Check GHCR write permission
        if: ${{ inputs.push_image }}
        env:
          TOKEN: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}
        run: |
          perms=$(curl -sSI -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/users/${{ github.repository_owner }}/packages \
            | grep -i 'x-accepted-github-permissions' || true)
          echo "令牌权限: ${perms:-<未返回>}"
          if [[ "$TOKEN" == "${{ secrets.GITHUB_TOKEN }}" ]]; then
            echo "⚠️ 使用内置 GITHUB_TOKEN：需仓库 Settings → Actions → General → Workflow permissions 设为 Read and write"
          else
            echo "✅ 使用 CR_PAT（PAT 需勾选 write:packages）"
          fi

      - name: Log in to GHCR
        if: ${{ inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false          # 关闭证明清单，避免 GHCR 对 attest manifest 报 denied
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max