networks:
  diy_bridge:
    driver: bridge
    name: diy_bridge

services:
# watchtower
  watchtower:
    restart: always
    network_mode: host
    container_name: watchtower
    image: docker.1ms.run/nickfedor/watchtower:latest
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    environment: {TZ: Asia/Shanghai,WATCHTOWER_CLEANUP: "true",WATCHTOWER_SCHEDULE: "0 0 6 * * *"}

# openlist(5244)
  openlist:
    user: "0:0"
    restart: always
    network_mode: host
    container_name: openlist
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/openlistteam/openlist:latest
    volumes: ["./data:/overlay","./data/openlist:/opt/openlist/data"]

# lucky(16601)
  lucky:
    restart: always
    network_mode: host
    profiles: [disabled]
    container_name: lucky
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/gdy666/lucky:latest
    volumes: ["./data/lucky:/goodluck","/var/run/docker.sock:/var/run/docker.sock"]

# gately(16680)
  gately:
    restart: always
    network_mode: host
    cap_add: [NET_ADMIN]
    profiles: [disabled]
    container_name: gately
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/vanjayak/gately:latest
    volumes: ["./data/gately:/etc/gately","/var/run/docker.sock:/var/run/docker.sock"]

# 1panel(8000)
  1panel:
    restart: always
    network_mode: host
    profiles: [disabled]
    container_name: 1panel
    image: docker.1ms.run/moelin/1panel:latest
    environment: {TZ: Asia/Shanghai,BASE_DIR: /opt,ENTRANCE: 1panel,PORT: "8000"}
    volumes: ["./data/1panel:/opt/1panel","/var/run/docker.sock:/var/run/docker.sock"]

# 联通token(8010)
  token:
    profiles: [disabled]
    ports: ["8010:5702"]
    container_name: token
    networks: [diy_bridge]
    restart: unless-stopped
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/twh808/unicom-login:latest

# 青龙面板(8011)
  qinglong:
    profiles: [disabled]
    ports: ["8011:5700"]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: qinglong
    environment: {TZ: Asia/Shanghai}
    volumes: ["./data/qinglong:/ql/data"]
    image: docker.1ms.run/whyour/qinglong:latest

# 呆呆面板(8012)
  ddpanel:
    profiles: [disabled]
    ports: ["8012:5700"]
    networks: [diy_bridge]
    container_name: ddpanel
    restart: unless-stopped
    environment: {TZ: Asia/Shanghai}
    volumes: ["./data/dumb-panel:/app/dumb-panel"]
    image: docker.1ms.run/linzixuanzz/daidai-panel:latest

# adguardhome(8013)
  adguardhome:
    profiles: [disabled]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: adguardhome
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/adguard/adguardhome:latest
    ports: ["8013:3000","153:53/tcp","153:53/udp","853:853/tcp","853:853/udp"]
    volumes: ["./data/adguard/work:/opt/adguardhome/work","./data/adguard/conf:/opt/adguardhome/conf"]

# apt-linux
  aptlinux:
    profiles: [disabled]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: aptlinux
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/library/debian:12
    entrypoint: ["/bin/bash", "-c", "set -e;m=/var/cache/.mirror_done;if [ ! -f \"$$m\" ];then (command -v curl &>/dev/null || (apt-get update && apt-get install -y curl));bash <(curl -sfSL https://linuxmirrors.cn/main.sh) --source mirrors.tencent.com --protocol http --backup true --upgrade-software true --clean-cache true --ignore-backup-tips;echo `(date)`>\"$$m\";fi;exec tail -f /dev/null"]

# yum-linux
  yumlinux:
    profiles: [disabled]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: yumlinux
    environment: {TZ: Asia/Shanghai}
    image: docker.1ms.run/library/rockylinux:9
    entrypoint: ["/bin/bash", "-c", "set -e;m=/var/cache/.mirror_done;if [ ! -f \"$$m\" ];then (command -v curl &>/dev/null || yum install -y curl);bash <(curl -sfSL https://linuxmirrors.cn/main.sh) --source mirrors.tencent.com --protocol http --install-epel true --backup true --upgrade-software true --clean-cache true --ignore-backup-tips;echo `(date)`>\"$$m\";fi;exec tail -f /dev/null"]
