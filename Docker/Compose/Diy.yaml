networks:
  "diy_bridge":
    driver: bridge
    name: diy_bridge
    enable_ipv6: true
    ipam: {config: [{subnet: "fd00:1::/64"}]}

services:
# watchtower
  "watchtower":
    restart: always
    networks: [diy_bridge]
    container_name: watchtower
    image: docker.1ms.run/nickfedor/watchtower:latest
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    environment: {TZ: asia/shanghai,WATCHTOWER_CLEANUP: "true",WATCHTOWER_SCHEDULE: "0 0 6 * * *"}

# openlist
  "openlist":
    user: "0:0"
    restart: always
    ports: ["5244:5244"]
    networks: [diy_bridge]
    container_name: openlist
    environment: {TZ: asia/shanghai}
    image: docker.1ms.run/openlistteam/openlist:latest
    volumes: ["./data:/overlay","./data/openlist:/opt/openlist/data"]

# lucky
  "lucky":
    restart: always
    profiles: [disabled]
    container_name: lucky
    ports: ["16601:16601"]
    networks: [diy_bridge]
    environment: {TZ: asia/shanghai}
    image: docker.1ms.run/gdy666/lucky:latest
    volumes: ["./data/lucky:/goodluck/data","/var/run/docker.sock:/var/run/docker.sock"]

# gately
  "gately":
    restart: always
    profiles: [disabled]
    container_name: gately
    ports: ["16680:16680"]
    networks: [diy_bridge]
    environment: {TZ: asia/shanghai}
    image: docker.1ms.run/vanjayak/gately:latest
    volumes: ["./data/gately:/etc/gately","/var/run/docker.sock:/var/run/docker.sock"]

# 1panel
  "1panel":
    restart: always
    profiles: [disabled]
    ports: ["8000:10086"]
    networks: [diy_bridge]
    container_name: 1panel
    image: docker.1ms.run/moelin/1panel:latest
    environment: {TZ: asia/shanghai,BASE_DIR: /opt,ENTRANCE: 1panel}
    volumes: ["./data/1panel:/opt/1panel","/var/run/docker.sock:/var/run/docker.sock"]

# 联通token
  "token":
    profiles: [disabled]
    ports: ["8010:5702"]
    container_name: token
    networks: [diy_bridge]
    restart: unless-stopped
    environment: {TZ: asia/shanghai}
    image: docker.1ms.run/twh808/unicom-login:latest

# 青龙面板
  "qinglong":
    profiles: [disabled]
    ports: ["8011:5700"]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: qinglong
    environment: {TZ: asia/shanghai}
    volumes: ["./data/qinglong:/ql/data"]
    image: docker.1ms.run/whyour/qinglong:latest

# 呆呆面板
  "ddpanel":
    profiles: [disabled]
    ports: ["8012:5700"]
    networks: [diy_bridge]
    container_name: ddpanel
    restart: unless-stopped
    environment: {TZ: asia/shanghai}
    volumes: ["./data/dumb-panel:/app/dumb-panel"]
    image: docker.1ms.run/linzixuanzz/daidai-panel:latest

# adguardhome
  "adguardhome":
    profiles: [disabled]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: adguardhome
    environment: {TZ: asia/shanghai}
    ports: ["8013:3000","153:53","853:853"]
    image: docker.1ms.run/adguard/adguardhome:latest
    volumes: ["./data/adguard/work:/opt/adguardhome/work","./data/adguard/conf:/opt/adguardhome/conf"]

# apt-linux
  "aptlinux":
    profiles: [disabled]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: aptlinux
    environment: {TZ: asia/shanghai}
    image: docker.1ms.run/library/debian:12
    entrypoint: ["/bin/bash", "-c", "set -e;m=/var/cache/.mirror_done;if [ ! -f \"$$m\" ];then (command -v curl &>/dev/null || (apt-get update && apt-get install -y curl));bash <(curl -sfsl https://gitee.com/supermanito/linuxmirrors/raw/main/changemirrors.sh) --source mirrors.tencent.com --protocol http --backup true --upgrade-software true --clean-cache true --ignore-backup-tips;echo `(date)`>\"$$m\";fi;exec tail -f /dev/null"]

# yum-linux
  "yumlinux":
    profiles: [disabled]
    networks: [diy_bridge]
    restart: unless-stopped
    container_name: yumlinux
    environment: {TZ: asia/shanghai}
    image: docker.1ms.run/library/rockylinux:9
    entrypoint: ["/bin/bash", "-c", "set -e;m=/var/cache/.mirror_done;if [ ! -f \"$$m\" ];then (command -v curl &>/dev/null || yum install -y curl);bash <(curl -sfsl https://gitee.com/supermanito/linuxmirrors/raw/main/changemirrors.sh) --source mirrors.tencent.com --protocol http --use-intranet-source false --install-epel true --backup true --upgrade-software true --clean-cache true --ignore-backup-tips;echo `(date)`>\"$$m\";fi;exec tail -f /dev/null"]
